apply plugin: 'com.android.application'

android {
    namespace "com.yuanbao.snake"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yuanbao.snake"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Capacitor 资源优化
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // 签名配置（Release 用；Debug 用默认调试密钥）
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // 优先从命令行 -P 参数读取，其次从 keystore.properties
            if (project.hasProperty('keystorePath') && file(keystorePath).exists()) {
                storeFile file(keystorePath)
            } else if (file('snake.keystore').exists()) {
                storeFile file('snake.keystore')
            }
            storePassword project.hasProperty('keystorePassword') ? keystorePassword : ""
            keyAlias project.hasProperty('keyAlias') ? keyAlias : "snake"
            keyPassword project.hasProperty('keyPassword') ? keyPassword : ""
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        aidl true
    }
}

repositories {
    google()
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    // Capacitor 核心库（从 Maven Central 拉取，无需本地 sync 产物）
    implementation "com.capacitorjs:core:$capacitorVersion"
}

// apply from: "$rootDir/capacitor.build.gradle"
