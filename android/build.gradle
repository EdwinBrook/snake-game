// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        // Capacitor 5.x 要求 compileSdkVersion / targetSdkVersion
        compileSdkVersion = 33
        targetSdkVersion = 33
        minSdkVersion = 21
        androidxActivityVersion = '1.7.0'
        androidxAppCompatVersion = '1.6.1'
        capacitorVersion = '5.7.0'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// 读取签名配置（如果存在）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

ext {
    keystorePath = keystoreProperties['keystorePath'] ?: System.getenv("KEYSTORE_PATH") ?: "snake.keystore"
    keystorePassword = keystoreProperties['keystorePassword'] ?: System.getenv("KEYSTORE_PASSWORD") ?: ""
    keyAlias = keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS") ?: "snake"
    keyPassword = keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD") ?: ""
}
