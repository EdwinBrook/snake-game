<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e1e2e">
    <title>贪吃蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            background: #1e1e2e; color: #eee;
            font-family: 'Segoe UI', '微软雅黑', sans-serif;
            overflow: hidden; touch-action: manipulation;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .game-wrapper {
            text-align: center; background: #2a2a3a;
            padding: 16px 20px 20px; border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            max-width: 520px; width: 100%;
        }

        h1 { font-size: 22px; margin-bottom: 10px; }

        .score-board {
            display: flex; justify-content: center; gap: 24px;
            font-size: 16px; background: #1a1a2a;
            padding: 8px 16px; border-radius: 8px; margin-bottom: 12px;
        }

        canvas {
            width: min(400px, 90vw); height: min(400px, 90vw);
            background: #0f0f1a; border: 2px solid #444; border-radius: 8px;
            touch-action: none; display: block; margin: 0 auto;
        }

        .controls { margin-top: 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .controls button {
            padding: 8px 16px; font-size: 15px; border: none; border-radius: 6px;
            background: #5b5bd6; color: #fff; cursor: pointer; min-width: 70px;
        }
        .controls button:active { background: #4a4ac2; }
        .controls button:disabled { background: #666; cursor: not-allowed; }

        .dpad {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 52px);
            gap: 8px; max-width: 180px; margin: 16px auto 0;
        }
        .dpad button {
            border: none; border-radius: 10px; background: #3a3a5a; color: #fff;
            font-size: 20px; cursor: pointer;
        }
        .dpad button:active { background: #5b5bd6; }
        .dpad .up { grid-column: 2; grid-row: 1; }
        .dpad .left { grid-column: 1; grid-row: 2; }
        .dpad .down { grid-column: 2; grid-row: 2; }
        .dpad .right { grid-column: 3; grid-row: 2; }

        .tips { margin-top: 12px; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>🐍 贪吃蛇</h1>
        <div class="score-board">
            <span>分数：<span id="score">0</span></span>
            <span>最高：<span id="best">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="pauseBtn" disabled>暂停</button>
            <button id="restartBtn">重开</button>
        </div>
        <div class="dpad">
            <button class="up" data-dx="0" data-dy="-1">▲</button>
            <button class="left" data-dx="-1" data-dy="0">◀</button>
            <button class="down" data-dx="0" data-dy="1">▼</button>
            <button class="right" data-dx="1" data-dy="0">▶</button>
        </div>
        <p class="tips">滑动屏幕或按方向键控制</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');

        const dpr = window.devicePixelRatio || 1;
        canvas.width = 400 * dpr; canvas.height = 400 * dpr;
        ctx.scale(dpr, dpr);

        const GRID = 20, COLS = 400 / GRID, ROWS = 400 / GRID;
        let snake = [], food = {}, dir = {x:1,y:0}, nextDir = {x:1,y:0};
        let score = 0, highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let speed = 150, running = false, gameOver = false, timer = null;
        let touchStartX = 0, touchStartY = 0;
        bestEl.textContent = highScore;

        function reset() {
            clearInterval(timer); timer = null;
            snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
            dir = {x:1,y:0}; nextDir = {x:1,y:0};
            score = 0; speed = 150; running = false; gameOver = false;
            updateScore(); generateFood(); draw();
            startBtn.disabled = false; pauseBtn.disabled = true;
        }

        function generateFood() {
            do { food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) }; }
            while (snake.some(s => s.x===food.x && s.y===food.y));
        }

        function changeDir(dx, dy) {
            if (dx !== 0) { if (dir.x !== 0 && dx === -dir.x) return; nextDir = {x:dx, y:0}; }
            else if (dy !== 0) { if (dir.y !== 0 && dy === -dir.y) return; nextDir = {x:0, y:dy}; }
        }

        function start() {
            if (running || gameOver) return;
            running = true; startBtn.disabled = true; pauseBtn.disabled = false;
            clearInterval(timer); timer = setInterval(step, speed);
        }

        function pause() {
            if (!running) return;
            running = false; clearInterval(timer);
            startBtn.disabled = false; pauseBtn.disabled = true;
        }

        function step() {
            if (!running) return;
            dir = {x:nextDir.x, y:nextDir.y};
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            if (head.x<0 || head.y<0 || head.x>=COLS || head.y>=ROWS ||
                snake.some(s => s.x===head.x && s.y===head.y)) { gameOverHandler(); return; }
            snake.unshift(head);
            if (head.x===food.x && head.y===food.y) {
                score += 10; updateScore();
                if (score % 50 === 0 && speed > 50) { speed -= 10; clearInterval(timer); timer = setInterval(step, speed); }
                generateFood();
            } else snake.pop();
            draw();
        }

        function draw() {
            ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0, 0, 400, 400);
            ctx.strokeStyle = '#1f1f2a'; ctx.lineWidth = 1;
            for (let i=1;i<COLS;i++) { ctx.beginPath(); ctx.moveTo(i*GRID,0); ctx.lineTo(i*GRID,400); ctx.stroke(); }
            for (let i=1;i<ROWS;i++) { ctx.beginPath(); ctx.moveTo(0,i*GRID); ctx.lineTo(400,i*GRID); ctx.stroke(); }
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(food.x*GRID+2, food.y*GRID+2, GRID-4, GRID-4);
            ctx.fillStyle = '#f39c12'; ctx.fillRect(food.x*GRID+5, food.y*GRID+5, GRID-10, GRID-10);
            snake.forEach((seg,i) => {
                ctx.fillStyle = i===0 ? '#f1c40f' : '#27ae60';
                ctx.fillRect(seg.x*GRID+1, seg.y*GRID+1, GRID-2, GRID-2);
            });
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,400,400);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 30px "微软雅黑"';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('游戏结束', 200, 180);
                ctx.font = '18px "微软雅黑"'; ctx.fillText('得分：' + score, 200, 220);
            }
        }

        function gameOverHandler() {
            running = false; gameOver = true; clearInterval(timer);
            if (score > highScore) { highScore = score; localStorage.setItem('snakeHighScore', highScore); bestEl.textContent = highScore; }
            draw(); startBtn.disabled = false; pauseBtn.disabled = true;
        }

        function updateScore() { scoreEl.textContent = score; }

        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            let dx=0, dy=0;
            if (['arrowup','w'].includes(k)) dy=-1;
            else if (['arrowdown','s'].includes(k)) dy=1;
            else if (['arrowleft','a'].includes(k)) dx=-1;
            else if (['arrowright','d'].includes(k)) dx=1;
            else return;
            e.preventDefault(); changeDir(dx, dy); if (!running && !gameOver) start();
        });

        canvas.addEventListener('touchstart', e => {
            if (e.touches.length > 0) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
            e.preventDefault();
        }, {passive:false});

        canvas.addEventListener('touchend', e => {
            if (e.changedTouches.length > 0) {
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                    if (Math.abs(dx) > Math.abs(dy)) changeDir(dx>0?1:-1, 0);
                    else changeDir(0, dy>0?1:-1);
                    if (!running && !gameOver) start();
                }
            }
            e.preventDefault();
        }, {passive:false});

        canvas.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

        document.querySelectorAll('.dpad button').forEach(btn => {
            btn.addEventListener('click', () => {
                changeDir(parseInt(btn.dataset.dx), parseInt(btn.dataset.dy));
                if (!running && !gameOver) start();
            });
        });

        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        restartBtn.addEventListener('click', reset);

        // 安卓返回键：退出确认
        window.addEventListener('popstate', () => { if (confirm('确定退出游戏？')) window.close(); });

        reset();
    </script>
</body>
</html>
